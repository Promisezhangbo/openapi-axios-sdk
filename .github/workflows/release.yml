name: Release

# 触发条件:推 v* tag(配合 `pnpm version patch && git push --follow-tags`)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance 依赖 GitHub Actions + 公共源仓库；私有仓库会 422，故不启用 `--provenance`。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (corepack reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `--no-git-checks` 让 CI 跳过本地 git 状态校验。
      # 私有仓库勿加 `--provenance`：npm 当前仅支持「公共源仓库」校验 sigstore provenance。
      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
