name: Release

# 触发条件:推 v* tag(配合 `pnpm version patch && git push --follow-tags`)。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 与 CI 共用同一套检查；仅当本 job 成功后才执行 publish（逻辑上「先检查再发布」）。
  check:
    uses: ./.github/workflows/reusable-check.yml
    with:
      node-version: '20'

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance 依赖 GitHub Actions + 公共源仓库；私有仓库会 422，故不启用 `--provenance`。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (corepack reads packageManager from package.json)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `prepublishOnly` 仍会再跑 clean + check + build（npm 发布安全网）。
      # `--no-git-checks` 让 CI 跳过本地 git 状态校验。
      # 私有仓库勿加 `--provenance`：npm 当前仅支持「公共源仓库」校验 sigstore provenance。
      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
